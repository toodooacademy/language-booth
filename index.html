<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F3EBE0" />
  <title>Language Booth — practice with Bao</title>
  <style>
    :root {
      --bg: #F3EBE0;
      --paper: #FFFBF5;
      --ink: #1E1A16;
      --muted: #6A6258;
      --line: #E4D8C8;
      --rust: #C24B2C;
      --rust-deep: #9A351C;
      --teal: #2A6B62;
      --teal-soft: #DCEEEC;
      --gold: #E0A01A;
      --cream: #F7F0E6;
      --blush: #F8E4DD;
      --ok: #2A6B62;
      --no: #C24B2C;
      --shadow: 0 10px 28px rgba(30, 26, 22, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #DDD3C5;
      color: var(--ink);
      font-family: "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans CJK TC", "Noto Color Emoji", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
      min-height: 0;
      overflow-y: auto;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      margin: -4px 0 10px;
    }
    .top h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
      line-height: 1.2;
    }
    .stats {
      display: flex;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .ghost, .back {
      border: 0;
      background: transparent;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--ink);
    }
    .ghost:active, .back:active { background: rgba(30,26,22,0.06); }
    .kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--rust);
      margin: 0 0 8px;
    }
    .title {
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 10px;
      font-weight: 800;
    }
    .lede {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); }
    .field input {
      width: 100%;
      min-height: 56px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      padding: 12px 16px;
      background: var(--paper);
      font-size: 18px;
      outline: none;
    }
    .field input:focus { box-shadow: 0 0 0 4px rgba(194,75,44,0.18); }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: #FFF8F0;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 3px 0 var(--ink);
    }
    .btn:active { transform: translateY(1px); box-shadow: 0 2px 0 var(--ink); }
    .btn:disabled { opacity: 0.4; box-shadow: none; }
    .btn.secondary {
      background: var(--paper);
      color: var(--ink);
    }
    .btn.teal { background: var(--teal); border-color: #1d4d47; box-shadow: 0 3px 0 #1d4d47; color: #fff; }
    .row-btns { display: flex; gap: 10px; }
    .row-btns .btn { flex: 1; }
    .grow { flex: 1; }
    .peek {
      margin-top: auto;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .face {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 36px;
      flex-shrink: 0;
      line-height: 1;
    }
    .face.lg { width: 108px; height: 108px; font-size: 60px; margin: 8px auto 12px; }
    .face.furious { background: #F8D8D0; }
    .face.annoyed { background: #F6E0C8; }
    .face.pride { background: #E3EEF8; }
    .face.calm { background: #E8E8E4; }
    .face.manic { background: #F8E7B0; }
    .face.scheming { background: #E8DDF6; }
    .face.dramatic { background: #F4D0E4; }
    .face.exhausted { background: #E4E0D8; }
    .face.unhinged { background: #F8D9B8; }
    .jitter { animation: jitter 0.22s infinite; }
    .shake { animation: shake 0.45s ease; }
    @keyframes jitter {
      0%, 100% { transform: translate(0,0) rotate(0); }
      20% { transform: translate(-2px, 1px) rotate(-5deg); }
      40% { transform: translate(2px, -1px) rotate(4deg); }
      60% { transform: translate(-1px, 2px) rotate(-3deg); }
      80% { transform: translate(1px, -2px) rotate(3deg); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-6px) rotate(-6deg); }
      40% { transform: translateX(6px) rotate(6deg); }
      60% { transform: translateX(-4px) rotate(-3deg); }
      80% { transform: translateX(4px) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .jitter, .shake { animation: none; }
    }
    .bubble {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 18px 18px 18px 6px;
      padding: 9px 11px;
      flex: 1;
      font-size: 14px;
      line-height: 1.35;
      min-width: 0;
    }
    .bubble b { font-weight: 800; }
    .mood-tag {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .teacher-bar {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .center { text-align: center; }
    .who { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.03em; }
    .switch {
      display: flex;
      background: #E8DFD2;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 4px;
      margin: 16px 0 12px;
    }
    .switch button {
      flex: 1;
      min-height: 48px;
      border: 0;
      background: transparent;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
    }
    .switch button.on {
      background: var(--ink);
      color: #FFF8F0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      margin: 0 0 16px;
      min-height: 56px;
    }
    .toggle-row span { font-weight: 700; font-size: 15px; }
    .toggle {
      width: 56px;
      height: 32px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: #E8DFD2;
      position: relative;
      flex-shrink: 0;
      padding: 0;
    }
    .toggle i {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      transition: left 0.15s ease;
      display: block;
    }
    .toggle.on { background: var(--teal); border-color: #1d4d47; }
    .toggle.on i { left: 26px; background: #fff; }
    .lang-list, .cat-list, .choices { display: flex; flex-direction: column; gap: 8px; }
    .lang-card, .cat-card, .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      min-height: 64px;
      padding: 12px 14px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 2px 0 rgba(30,26,22,0.12);
    }
    .lang-card:active, .cat-card:active, .choice:active { transform: translateY(1px); box-shadow: none; }
    .flag { font-size: 28px; width: 36px; text-align: center; line-height: 1; }
    .lang-card .meta, .cat-card .meta { flex: 1; min-width: 0; }
    .lang-card strong, .cat-card strong { display: block; font-size: 17px; }
    .lang-card em, .cat-card em, .hint {
      display: block;
      font-style: normal;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .chev { color: var(--muted); font-size: 20px; }
    .modes {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin: 0 0 12px;
      padding-bottom: 2px;
    }
    .chip {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: transparent;
      font-weight: 700;
      font-size: 13px;
    }
    .chip.on { background: var(--ink); color: #FFF8F0; }
    .card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 22px;
      padding: 12px 14px 14px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }
    .word-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .word {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 2px 0;
    }
    .reading {
      color: var(--muted);
      font-size: 16px;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .meaning { font-size: 18px; font-weight: 700; margin: 8px 0 0; }
    .prompt {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .choice.ok { background: var(--teal-soft); border-color: var(--teal); }
    .choice.no { background: var(--blush); border-color: var(--no); }
    .choice { min-height: 48px; font-weight: 700; font-size: 16px; }
    .choice[disabled] { cursor: default; }
    .teach {
      background: #fff;
      border: 2px dashed var(--teal);
      border-radius: 16px;
      padding: 10px 12px;
      margin: 0 0 10px;
      font-size: 15px;
    }
    .teach .lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 4px;
    }
    .icon-btn {
      min-width: 48px;
      min-height: 48px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: var(--paper);
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .progress {
      height: 6px;
      background: #E8DFD2;
      border-radius: 99px;
      margin: 0 0 10px;
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: var(--rust);
      border-radius: 99px;
    }
    .dialogue { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .line {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 7px 10px;
      text-align: left;
    }
    .line:not(.current) .tx { font-size: 15px; font-weight: 700; }
    .line:not(.current) .rd { display: none; }
    .line.current { border-color: var(--ink); box-shadow: var(--shadow); }
    .line .sp {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--rust);
      text-transform: uppercase;
    }
    .line .tx { font-size: 17px; font-weight: 800; margin: 2px 0; }
    .line .rd, .line .mn { font-size: 13px; color: var(--muted); font-weight: 600; }
    .line .mn { color: var(--ink); }
    .home-hi { margin: 4px 0 4px; }
    .tiny {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .linkish {
      background: none;
      border: 0;
      color: var(--rust-deep);
      font-weight: 700;
      min-height: 44px;
      padding: 8px;
    }
    .rec {
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
      margin: 6px 0 8px;
      text-align: center;
    }
    .setting { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 8px; text-align: left; }
  
    .bao-face {
      position: relative;
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      --mouth-open: 0;
      --mouth-scale: 1;
    }
    .bao-face.md { width: 88px; height: 88px; }
    .bao-face.lg { width: 120px; height: 120px; }
    .bao-head {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--ink);
      background: #e8dfd2;
      position: relative;
      transform-origin: 50% 75%;
    }
    .bao-face.selected .bao-head { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
    .bao-face.dimmed { opacity: 0.48; transform: scale(0.92); }
    .bao-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .bao-closed { z-index: 1; }
    .bao-open { z-index: 2; opacity: var(--mouth-open); }
    .bao-mouth {
      position: absolute;
      left: calc(var(--mx) * 1%);
      top: calc(var(--my) * 1%);
      width: calc(var(--mw) * 1%);
      height: calc(var(--mh) * 1%);
      overflow: hidden;
      border-radius: 50% 50% 46% 46%;
      opacity: var(--mouth-open);
      transform: scaleY(var(--mouth-scale));
      transform-origin: 50% 30%;
      z-index: 3;
      pointer-events: none;
    }
    .bao-mouth img {
      position: absolute;
      width: calc(100% * 100 / var(--mw));
      height: calc(100% * 100 / var(--mh));
      max-width: none;
      left: calc(-100% * var(--mx) / var(--mw));
      top: calc(-100% * var(--my) / var(--mh));
    }
    .bao-tears {
      position: absolute;
      right: 10%;
      top: 42%;
      z-index: 4;
      font-size: 0.45em;
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }
    .bao-face.talking .bao-head { animation: bao-bob 0.55s ease-in-out infinite; }
    .bao-face.furious .bao-head, .bao-face.annoyed .bao-head, .bao-face.dramatic .bao-head {
      animation: bao-shake 0.32s linear infinite;
    }
    .bao-face.calm .bao-head {
      animation: bao-calm 3.4s ease-in-out infinite;
    }
    .bao-face.manic .bao-head, .bao-face.unhinged .bao-head {
      animation: bao-bounce 0.45s ease-in-out infinite;
    }
    .bao-face.meltdown .bao-head {
      animation: bao-meltdown 0.28s ease-in-out infinite;
    }
    @keyframes bao-meltdown {
      0%, 100% { transform: translate(-2px, 0) rotate(-5deg) scale(1); }
      25% { transform: translate(3px, -3px) rotate(6deg) scale(1.05); }
      50% { transform: translate(-3px, 1px) rotate(-4deg) scale(1.03); }
      75% { transform: translate(2px, -2px) rotate(5deg) scale(1.06); }
    }
    .bao-face.pride .bao-head { filter: saturate(0.92) brightness(1.04); }
    .bao-face.exhausted .bao-head { filter: grayscale(0.2) brightness(0.96); }
    .bao-face.scheming .bao-head { animation: bao-tilt 2.8s ease-in-out infinite; }
    .bao-face.tilt .bao-head { animation: bao-tilt 0.9s ease-in-out infinite; }
    .bao-face.shake .bao-head { animation: bao-shake 0.28s linear infinite; }
    @keyframes bao-bob {
      0%, 100% { transform: rotate(-1.4deg) translateY(0); }
      50% { transform: rotate(1.5deg) translateY(1px); }
    }
    @keyframes bao-shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-2px) rotate(-3deg); }
      75% { transform: translateX(2px) rotate(3deg); }
    }
    @keyframes bao-calm {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50% { transform: rotate(-4deg) scale(1.05); }
    }
    @keyframes bao-bounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    @keyframes bao-tilt {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bao-face .bao-head, .bao-face.talking .bao-head { animation: none; }
    }
    html[data-shot] .bao-head { animation: none !important; }
    .roster {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 4px 0 10px;
    }
    .roster-card { text-align: center; }
    .roster-name {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 800;
    }
    .roster-card .bao-face { margin: 0 auto; }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 276px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 8px 14px;
      margin: 4px 0 10px;
      -webkit-overflow-scrolling: touch;
    }
    .char-card {
      appearance: none;
      border: 2px solid transparent;
      background: #fff;
      border-radius: 14px;
      padding: 6px 4px 8px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(60,40,20,0.06);
      position: relative;
      scroll-margin: 10px;
    }
    .char-card.on {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px #1a1a1a;
      z-index: 1;
    }
    .bao-face[data-engine] .bao-head {
      animation: none !important;
      overflow: hidden;
      border-radius: 50%;
    }
    .bao-face[data-engine] canvas.bao-engine {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }
    .char-face canvas.bao-engine {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }
    .char-face {
      display: block;
      width: 58px;
      height: 58px;
      margin: 0 auto 4px;
      border-radius: 50%;
      overflow: hidden;
      background: #efe6d8;
    }
    .char-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .char-name {
      display: block;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      color: #1a1a1a;
    }
    .char-style {
      display: block;
      font-size: 9px;
      color: #8a7460;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .char-card .stick-note { display: none; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>

/* ===== 02-data.js ===== */

const STORAGE_KEY = "bao-language-booth-v1";

const LANGS = {
  vi: { id: "vi", flag: "🇻🇳", name: "Vietnamese", native: "Tiếng Việt", speech: "vi-VN" },
  zh: { id: "zh", flag: "🇨🇳", name: "Chinese", native: "中文（普通话）", speech: "zh-CN" },
  ja: { id: "ja", flag: "🇯🇵", name: "Japanese", native: "日本語", speech: "ja-JP" },
  es: { id: "es", flag: "🇪🇸", name: "Spanish", native: "Español", speech: "es-ES" },
  en: { id: "en", flag: "🇺🇸", name: "English", native: "English", speech: "en-US" }
};

const W = (text, meaning, reading, speak) => ({
  text, meaning, reading: reading || "", speak: speak || text
});

const CURRICULUM = {
  vi: {
    words: [
      W("xin chào", "hello"),
      W("cảm ơn", "thank you"),
      W("xin lỗi", "sorry / excuse me"),
      W("vâng", "yes (polite)"),
      W("không", "no"),
      W("một", "one"),
      W("hai", "two"),
      W("ba", "three"),
      W("bốn", "four"),
      W("năm", "five"),
      W("sáu", "six"),
      W("bảy", "seven"),
      W("tám", "eight"),
      W("chín", "nine"),
      W("mười", "ten"),
      W("mẹ", "mother"),
      W("bố", "father"),

(function fixJaSpeak() {
  const map = {
    "一": "いち", "二": "に", "三": "さん", "四": "よん", "五": "ご",
    "六": "ろく", "七": "なな", "八": "はち", "九": "きゅう", "十": "じゅう",

    "食べる": "たべる", "飲む": "のむ", "行く": "いく", "欲しい": "ほしい"
  };
  CURRICULUM.ja.words.forEach((w) => { if (map[w.text]) w.speak = map[w.text]; });
})();

function teacherByGender(gender) {
  return gender === "she" ? CHARACTERS.co_bao : CHARACTERS.thay_bao;
}

const VISEME_OPEN = { rest: 0, M: 0, F: 0.28, E: 0.58, O: 0.84, A: 1 };
const VISEME_SCALE = { rest: 1, M: 1, F: 1, E: 1.03, O: 1.07, A: 1.12 };

function visemeForText(chunk) {
  const s = String(chunk || "").toLowerCase().normalize("NFD");
  const chars = s.replace(/[^a-z]/g, "");
  if (!chars) return "A";
  for (let i = chars.length - 1; i >= 0; i--) {
    const ch = chars[i];
    if ("mbp".indexOf(ch) >= 0) return "M";
    if ("fv".indexOf(ch) >= 0) return "F";
    if (ch === "a") return "A";
    if ("eiy".indexOf(ch) >= 0) return "E";
    if ("ou".indexOf(ch) >= 0) return "O";
  }
  return "A";
}

function resolveFrame(teacher, viseme, mood) {
  const f = (teacher && teacher.frames) || {};
  const vis = f.visemes || {};
  const moodPack = (f.moods && mood && f.moods[mood]) || {};
  const closed = moodPack.closed || f.closed || "";
  const open = moodPack.open || f.open || closed;
  if (!viseme || viseme === "rest" || viseme === "M") {
    return moodPack.M || vis.M || closed;
  }
  if (viseme === "F") return moodPack.F || vis.F || open;
  if (viseme === "E") return moodPack.E || vis.E || open;
  if (viseme === "O") return moodPack.O || vis.O || open;
  if (viseme === "A") return moodPack.A || vis.A || open;
  return vis[viseme] || moodPack[viseme] || open || closed;
}

const TALK = {
  on: false,
  viseme: "rest",
  open: 0,
  scale: 1,
  text: "",
  words: [],
  wi: 0,
  timers: []
};

function clearTalkTimers() {
  TALK.timers.forEach(function (id) { clearTimeout(id); });
  TALK.timers = [];
}

function setViseme(viseme) {
  const v = viseme || "rest";
  TALK.viseme = v;
  TALK.open = VISEME_OPEN[v] != null ? VISEME_OPEN[v] : 0.7;
  TALK.scale = VISEME_SCALE[v] != null ? VISEME_SCALE[v] : 1;
  applyMouthToDOM();
}

function applyMouthToDOM() {
  const teacher = (typeof currentTeacher === "function")
    ? currentTeacher()
    : teacherByGender((window.persist && persist.gender) || "he");
  const nodes = document.querySelectorAll(".bao-face");
  for (let i = 0; i < nodes.length; i++) {
    const el = nodes[i];
    const id = el.getAttribute("data-teacher");
    const mood = el.getAttribute("data-mood") || "";
    const active = id === teacher.id;
    const talking = active && TALK.on;
    el.classList.toggle("talking", talking);
    const open = talking ? TALK.open : 0;
    const scale = talking ? TALK.scale : 1;
    el.style.setProperty("--mouth-open", String(open));
    el.style.setProperty("--mouth-scale", String(scale));
    const viseme = talking ? TALK.viseme : "rest";
    const src = resolveFrame(teacher, viseme, mood);
    const openImg = el.querySelector(".bao-open");
    const mouthImg = el.querySelector(".bao-mouth img");
    if (active && src && viseme !== "rest" && viseme !== "M") {
      if (openImg) openImg.src = src;
      if (mouthImg) mouthImg.src = src;
    }
  }
}

function stopTalking(close) {
  clearTalkTimers();
  TALK.on = false;
  if (close !== false) setViseme("rest");
  else applyMouthToDOM();
}

function startTalking(text) {
  clearTalkTimers();
  TALK.on = true;
  TALK.text = String(text || "");
  TALK.words = TALK.text.split(/\s+/).filter(Boolean);
  TALK.wi = 0;
  const duration = Math.min(6500, Math.max(900, TALK.text.length * 55 + 280));
  function beat() {
    if (!TALK.on) return;
    const chunk = TALK.words.length
      ? TALK.words[TALK.wi % TALK.words.length]
      : TALK.text;
    TALK.wi += 1;
    setViseme(visemeForText(chunk));
    const next = 95 + Math.random() * 150;
    TALK.timers.push(setTimeout(beat, next));
  }
  beat();
  TALK.timers.push(setTimeout(function () { stopTalking(true); }, duration));
}

function onSpeechBoundary(ev) {
  if (!TALK.on) return;
  const start = ev.charIndex || 0;
  const len = ev.charLength || 8;
  const chunk = TALK.text.slice(start, start + len);
  setViseme(visemeForText(chunk || ev.name || ""));
}

function onSpeechEnd() {
  stopTalking(true);
}

function faceHTML(teacher, opts) {
  opts = opts || {};
  const size = opts.size || "sm";
  const mood = opts.mood || "";
  const anim = opts.anim || "";
  const selected = opts.selected !== false;
  const m = teacher.mouth || { x: 38, y: 46, w: 24, h: 16 };
  const closed = (teacher.frames && teacher.frames.closed) || "";
  const open = (teacher.frames && teacher.frames.open) || closed;
  const alt = teacher.name || "Teacher";
  const tears = (mood === "pride") ? '<span class="bao-tears" aria-hidden="true">💧</span>' : "";
  return (
    '<div class="bao-face ' + size + (mood ? " " + mood : "") + (anim ? " " + anim : "") + (selected ? " selected" : " dimmed") + '"' +
      ' data-teacher="' + teacher.id + '"' +
      ' data-gender="' + teacher.gender + '"' +
      ' data-mood="' + mood + '"' +
      ' style="--mx:' + m.x + ';--my:' + m.y + ';--mw:' + m.w + ';--mh:' + m.h + ';--mouth-open:0;--mouth-scale:1"' +
      ' aria-hidden="true">' +
      '<div class="bao-head">' +
        '<img class="bao-frame bao-closed" alt="' + alt + '" src="' + closed + '" onerror="this.onerror=null;this.src=\'' + (teacher.gender === "she" ? (typeof STICK_SHE!=="undefined"?STICK_SHE:closed) : (typeof STICK_HE!=="undefined"?STICK_HE:closed)) + '\'">' +
        '<img class="bao-frame bao-open" alt="" src="' + open + '" onerror="this.onerror=null;this.src=this.previousElementSibling?this.previousElementSibling.src:this.src">' +
        '<div class="bao-mouth"><img alt="" src="' + open + '"></div>' +

const MOOD_STATE = {
  calm: "suspiciously-calm",
  annoyed: "furious",
  dramatic: "scheming",
  furious: "furious",
  manic: "manic-joy",
  unhinged: "manic-joy",
  pride: "weeping-with-pride",
  exhausted: "neutral-closed",
  scheming: "scheming"
};
const VISEME_STATE = { rest: "neutral-closed", M: "viseme-m", F: "viseme-f", E: "viseme-e", O: "viseme-o", A: "viseme-a" };

let ROSTER_MANIFEST = ROSTER_SNAPSHOT;
let ROSTER_BY_ID = {};

function stickFor(gender) {
  return gender === "she" ? STICK_SHE : STICK_HE;
}

function framePath(id, state) {
  return "characters/" + id + "/" + state + ".jpg";
}

function charHasState(rec, state) {
  return rec && rec.states && rec.states.indexOf(state) >= 0;
}

function pickFrameState(rec, wanted, fallbacks) {
  const list = [wanted].concat(fallbacks || []);
  for (let i = 0; i < list.length; i++) {
    if (charHasState(rec, list[i])) return list[i];
  }
  return charHasState(rec, "neutral-closed") ? "neutral-closed" : null;
}

function buildTeacher(rec) {
  const closedState = pickFrameState(rec, "neutral-closed", ["viseme-m", "furious"]);
  const openState = pickFrameState(rec, "viseme-a", ["furious", "viseme-o", "neutral-closed"]);
  const closed = closedState ? framePath(rec.id, closedState) : stickFor(rec.gender);
  const open = openState ? framePath(rec.id, openState) : closed;
  const visemes = {};
  const vfall = ["viseme-a", "furious", "neutral-closed"];
  ["A", "E", "O", "M", "F"].forEach(function (v) {
    const st = pickFrameState(rec, VISEME_STATE[v], v === "M" ? ["neutral-closed", "viseme-a"] : vfall);
    if (st) visemes[v] = framePath(rec.id, st);
  });
  const moods = {};
  Object.keys(MOOD_STATE).forEach(function (mood) {
    const st = pickFrameState(rec, MOOD_STATE[mood], ["neutral-closed", "furious"]);
    if (!st) return;
    moods[mood] = {
      closed: framePath(rec.id, st),
      open: (pickFrameState(rec, "viseme-a", [st, "furious"]) ? framePath(rec.id, pickFrameState(rec, "viseme-a", [st, "furious"])) : framePath(rec.id, st))
    };
  });
  const voice = rec.voice || {};
  // speechSynthesis-friendly numeric rate/pitch plus original strings
  const rateStr = String(voice.rate || "+0%");
  const pitchStr = String(voice.pitch || "+0Hz");
  const rateN = 1 + (parseFloat(rateStr) || 0) / 100;
  const pitchN = 1 + (parseFloat(pitchStr) || 0) / 50;
  return {
    id: rec.id,
    name: rec.name,
    gender: rec.gender,
    style: rec.style,
    quirk: rec.quirk,
    states: rec.states.slice(),
    audioId: rec.audioId || rec.id,
    lessonGender: rec.lessonGender || rec.gender,
    mouth: rec.mouth || { x: 38, y: 48, w: 24, h: 16 },
    voice: {
      lang: voice.lang || "en-US",
      name: voice.name || "",
      rate: Math.max(0.7, Math.min(1.3, rateN)),
      pitch: Math.max(0.7, Math.min(1.6, pitchN)),
      rateStr: rateStr,
      pitchStr: pitchStr
    },
    frames: { closed: closed, open: open, visemes: visemes, moods: moods }
  };
}

function rebuildRoster(man) {
  ROSTER_MANIFEST = man || ROSTER_SNAPSHOT;
  ROSTER_BY_ID = {};
  (ROSTER_MANIFEST.characters || []).forEach(function (rec) {
    // apply skip list
    const skip = (ROSTER_MANIFEST.skip && ROSTER_MANIFEST.skip[rec.id]) || (ROSTER_SNAPSHOT.skip && ROSTER_SNAPSHOT.skip[rec.id]) || [];
    rec = Object.assign({}, rec, { states: (rec.states || []).filter(function (s) { return skip.indexOf(s) < 0; }) });
    ROSTER_BY_ID[rec.id] = buildTeacher(rec);
  });
  // aliases used by older faceHTML / shots
  if (ROSTER_BY_ID["real-m-01"]) {
    ROSTER_BY_ID["thay_bao"] = ROSTER_BY_ID["real-m-01"];
    CHARACTERS.thay_bao = Object.assign({}, CHARACTERS.thay_bao, ROSTER_BY_ID["real-m-01"], {
      frames: Object.assign({}, CHARACTERS.thay_bao.frames, ROSTER_BY_ID["real-m-01"].frames)
    });
  }
  if (ROSTER_BY_ID["real-f-01"]) {
    ROSTER_BY_ID["co_bao"] = ROSTER_BY_ID["real-f-01"];
    CHARACTERS.co_bao = Object.assign({}, CHARACTERS.co_bao, ROSTER_BY_ID["real-f-01"], {
      frames: Object.assign({}, CHARACTERS.co_bao.frames, ROSTER_BY_ID["real-f-01"].frames)
    });
  }
}

function rosterGender() {

function defaultCharId(gender) {

function ensureCharPersist() {
  if (typeof persist === "undefined") return;

function updateFaceDrive(dt) {
  const talking = !!(typeof TALK !== "undefined" && TALK.on);
  FACE_DRIVE.talking = talking;
  let vis = talking ? (TALK.viseme || "A") : "M";
  let next = vis;
  let blend = 0;
  if (talking && typeof wordTimings !== "undefined" && wordTimings && wordTimings.length && typeof clipAudio !== "undefined" && clipAudio) {
    const t = clipAudio.currentTime || 0;
    const ahead = 0.07;
    let cur = null, nxt = null;
    for (let i = 0; i < wordTimings.length; i++) {
      const w = wordTimings[i];
      const start = w.start || 0;
      const end = start + (w.duration || 0.12) + 0.04;
      if (t >= start && t < end) cur = w;
      if (start > t && start <= t + ahead) { nxt = w; break; }
    }
    if (cur) vis = visemeForText(cur.text);
    if (nxt) {
      next = visemeForText(nxt.text);
      const start = nxt.start || 0;
      blend = 1 - Math.max(0, Math.min(1, (start - t) / ahead));
    }
  }
  // RMS envelope
  let amp = talking ? (TALK.open || 0.4) : 0;
  if (talking && typeof analyserNode !== "undefined" && analyserNode) {
    try {
      const data = new Uint8Array(analyserNode.fftSize);
      analyserNode.getByteTimeDomainData(data);
      let s = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        s += v * v;
      }
      amp = Math.sqrt(s / data.length);
    } catch (e) {}
  }
  const atk = amp > FACE_DRIVE.env ? 0.018 : 0.07;
  FACE_DRIVE.env += (amp - FACE_DRIVE.env) * (1 - Math.exp(-(dt || 0.016) / atk));
  FACE_DRIVE.amp = FACE_DRIVE.env;
  FACE_DRIVE.viseme = vis || "M";
  FACE_DRIVE.nextViseme = next || vis;
  FACE_DRIVE.blend = blend;
  FACE_DRIVE.open = talking ? Math.max(FACE_DRIVE.env * 6, TALK.open || 0) : 0;
}

function sizeCanvas(cv) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, cv.clientWidth || cv.parentElement && cv.parentElement.clientWidth || 68);
  const h = Math.max(1, cv.clientHeight || cv.parentElement && cv.parentElement.clientHeight || w);
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph) {
    cv.width = pw;
    cv.height = ph;
  }
  return { w: pw, h: ph, dpr: dpr, css: w };
}

/* ---------- Stick figure ---------- */
function StickEngine(cv, teacher) {
  this.cv = cv;
  this.teacher = teacher;
  this.she = teacher && teacher.gender === "she";
  this.mouth = { open: { x: 0.06, v: 0 }, width: { x: 0.58, v: 0 }, round: { x: 0.18, v: 0 }, smile: { x: 0.25, v: 0 } };
  this.blink = { x: 0, v: 0 };
  this.thumb = { x: 0, v: 0 };
  this.brow = { x: 0, v: 0 };
  this.nextBlink = 1.5 + Math.random() * 3;
  this.t = Math.random() * 10;
  this.phase = Math.random() * Math.PI * 2;
}

StickEngine.prototype.level = function (el) {
  const mood = (el && el.getAttribute("data-mood")) || (typeof S !== "undefined" && S.mood) || "calm";
  const anim = (el && el.getAttribute("data-anim")) || (typeof S !== "undefined" && S.anim) || "";
  if (anim === "meltdown" || mood === "manic" || mood === "unhinged") return 4;
  if (anim === "shake" || mood === "furious") return 3;
  if (anim === "tilt" || mood === "dramatic") return 2;
  if (mood === "annoyed") return 1;
  return 0;
};

StickEngine.prototype.tick = function (dt, ts) {
  const cv = this.cv;
  const el = cv.closest(".bao-face") || cv.closest(".char-face") || cv.parentElement;
  const sz = sizeCanvas(cv);
  const ctx = cv.getContext("2d");
  const thumbOnly = cv.getAttribute("data-thumb") === "1";
  this.t += dt;
  const talking = !thumbOnly && FACE_DRIVE.talking;
  const vis = talking ? FACE_DRIVE.viseme : "rest";
  const next = talking ? FACE_DRIVE.nextViseme : vis;
  const a0 = MOUTH_SHAPE[vis] || MOUTH_SHAPE.rest;
  const a1 = MOUTH_SHAPE[next] || a0;
  const u = talking ? (FACE_DRIVE.blend || 0) : 0;
  const openT = (a0.open * (1 - u) + a1.open * u) * (talking ? Math.max(0.35, Math.min(1.15, 0.45 + FACE_DRIVE.open)) : 1);
  springStep(this.mouth.open, thumbOnly ? 0.06 : openT, dt, talking ? 22 : 12);
  springStep(this.mouth.width, a0.width * (1 - u) + a1.width * u, dt, 18);
  springStep(this.mouth.round, a0.round * (1 - u) + a1.round * u, dt, 18);
  springStep(this.mouth.smile, a0.smile * (1 - u) + a1.smile * u, dt, 14);

  this.nextBlink -= dt;
  if (this.nextBlink <= 0) {
    this.blink.x = 1;
    this.nextBlink = 2.2 + Math.random() * 3.5;
  }
  springStep(this.blink, 0, dt, 28);

  const mood = (el && el.getAttribute("data-mood")) || (typeof S !== "undefined" && S.mood) || "calm";
  const browT = mood === "furious" || mood === "annoyed" ? 1 : mood === "manic" || mood === "unhinged" ? -0.8 : mood === "scheming" ? 0.35 : mood === "pride" ? -0.3 : 0;
  springStep(this.brow, browT, dt, 10);

  const wantThumb = !thumbOnly && (el && el.getAttribute("data-thumbs") === "1" || (typeof S !== "undefined" && S.correct === true && (mood === "calm" || mood === "pride")));
  if (wantThumb && this.thumb.x < 0.9) { this.thumb.x = 1; this.thumb.v = 0; }
  else springStep(this.thumb, wantThumb ? 1 : 0, dt, 16);

  const lvl = thumbOnly ? 0 : this.level(el);

StickEngine.prototype.draw = function (ctx, sz, lvl, mood, talking) {
  const w = sz.w, h = sz.h;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.scale(w / 80, h / 80);
  const t = this.t + this.phase;
  const breath = 1 + 0.015 * Math.sin(t * 2.2);
  const sway = (lvl >= 4 ? 7 : lvl === 3 ? 3.5 : lvl === 2 ? 2 : 1.1) * Math.sin(t * (lvl >= 4 ? 11 : lvl >= 3 ? 8 : 2.4));
  const hop = lvl >= 4 ? Math.abs(Math.sin(t * 11)) * 2.4 : lvl === 3 ? Math.abs(Math.sin(t * 8)) * 1.1 : 0;
  ctx.translate(40, 44 - hop);

  ctx.scale(1, breath);
  ctx.translate(-40, -44);

  const ink = "#4a3424";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = ink;
  ctx.fillStyle = "#f7efe4";

    ctx.fill();
    ctx.fillStyle = "#f7efe4";

  const th = Math.max(0, Math.min(1, this.thumb.x));
  if (th > 0.05) aR = 0.85 * (1 - th) + 2.15 * th; // up-right, stays in the circle
  const armLen = 13.5 + flail * 2.2 - th * 1.5;

  function arm(ang, hand) {
    const sx = 40, sy = 40;
    const ex = sx + Math.sin(ang) * armLen;
    const ey = sy + Math.cos(ang) * armLen;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (hand === "thumb") {
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(ex, ey, 2.2, 0, Math.PI * 2);
      ctx.stroke();
      // thumb pointed up, clearly inside the crop
      ctx.beginPath();
      ctx.moveTo(ex, ey - 1.4);
      ctx.lineTo(ex - 0.4, ey - 7.2);
      ctx.stroke();
      ctx.lineWidth = 2.2;
    } else if (lvl >= 2) {
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.lineWidth = 2.2;
  arm(aL, "none");
  arm(aR, th > 0.45 ? "thumb" : "none");

  // hips / legs / skirt
  if (this.she) {
    ctx.beginPath();
    ctx.moveTo(40, 51.5);
    ctx.lineTo(31.5, 60);
    ctx.lineTo(48.5, 60);
    ctx.closePath();
    ctx.fillStyle = "#f7efe4";
    ctx.fill();
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(40, this.she ? 60 : 52);
  ctx.lineTo(33 + (lvl >= 4 ? Math.sin(t * 14) * 3 : 0), 73);
  ctx.moveTo(40, this.she ? 60 : 52);
  ctx.lineTo(47 + (lvl >= 4 ? Math.cos(t * 14) * 3 : 0), 73);
  ctx.stroke();

  ctx.restore();
};

StickEngine.prototype.drawMouth = function (ctx) {
  const o = this.mouth.open.x;
  const wd = this.mouth.width.x;
  const rd = this.mouth.round.x;
  const sm = this.mouth.smile.x;
  const cx = 40, cy = 29.2;
  const hw = 7.2 * wd;
  const hh = 2.2 + 6.2 * o;
  const smileY = sm * 1.4;
  ctx.save();
  ctx.strokeStyle = "#3a2418";
  ctx.fillStyle = "#3a2418";
  ctx.lineWidth = 1.4;
  if (o < 0.14) {
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy + smileY * 0.2);
    ctx.quadraticCurveTo(cx, cy + 1.6 + smileY, cx + hw, cy + smileY * 0.2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy - hh * 0.15);
    ctx.bezierCurveTo(cx - hw * rd, cy - hh, cx + hw * rd, cy - hh, cx + hw, cy - hh * 0.15);
    ctx.bezierCurveTo(cx + hw * 0.7, cy + hh + smileY, cx - hw * 0.7, cy + hh + smileY, cx - hw, cy - hh * 0.15);
    ctx.closePath();
    ctx.fill();
    if (o > 0.45) {
      ctx.fillStyle = "#c45a5a";
      ctx.beginPath();
      ctx.ellipse(cx, cy + hh * 0.28, hw * 0.42, hh * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (o > 0.22) {
      ctx.fillStyle = "#f4f0ea";
      ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.42, hw * 0.55, Math.max(0.6, hh * 0.16), 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
};

/* ---------- Photo canvas ---------- */
const BITMAP_CACHE = {}; // key id/state

function frameUrl(id, state) { return "characters/" + id + "/" + state + ".jpg"; }

function loadBitmap(id, state) {
  const key = id + "/" + state;
  if (BITMAP_CACHE[key]) return BITMAP_CACHE[key];
  const p = new Promise(function (resolve) {
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = function () {
      const done = function (bmp) { BITMAP_CACHE[key] = Promise.resolve(bmp); resolve(bmp); };
      if (window.createImageBitmap) {
        createImageBitmap(im).then(done).catch(function () { done(im); });
      } else done(im);
    };
    im.onerror = function () { resolve(null); };
    im.src = frameUrl(id, state);
  });
  BITMAP_CACHE[key] = p;
  return p;
}

function PhotoEngine(cv, teacher) {
  this.cv = cv;
  this.teacher = teacher;
  this.id = photoIdOf(teacher);
  this.states = (teacher.states || []).slice();
  this.mouth = teacher.mouth || { x: 38, y: 46, w: 24, h: 16 };
  this.align = ALIGN_MAP[this.id] || {};
  this.ready = false;
  this.bitmaps = {};
  this.moodW = {};
  this.visW = {};
  this.blink = { x: 0, v: 0 };
  this.nextBlink = 1.8 + Math.random() * 3;
  this.t = Math.random() * 8;
  this.offscreen = document.createElement("canvas");
  this.mask = document.createElement("canvas");
  const self = this;
  Promise.all(this.states.map(function (s) {
    return loadBitmap(self.id, s).then(function (bmp) { if (bmp) self.bitmaps[s] = bmp; });
  })).then(function () { self.ready = true; });
}

PhotoEngine.prototype.ensureSpring = function (map, key) {
  if (!map[key]) map[key] = { x: 0, v: 0 };
  return map[key];
};

PhotoEngine.prototype.tick = function (dt, ts) {
  const cv = this.cv;
  const el = cv.closest(".bao-face") || cv.parentElement;
  const sz = sizeCanvas(cv);
  const ctx = cv.getContext("2d");
  this.t += dt;
  const moodName = (el && el.getAttribute("data-mood")) || (typeof S !== "undefined" && S.mood) || "calm";
  const moodState = (typeof pickFrameState === "function" && this.teacher)
    ? pickFrameState({ id: this.id, states: this.states }, (typeof MOOD_STATE !== "undefined" && MOOD_STATE[moodName]) || "neutral-closed", ["neutral-closed", "furious"])
    : (this.bitmaps["neutral-closed"] ? "neutral-closed" : this.states[0]);
  const talking = FACE_DRIVE.talking && !(typeof SHOT !== "undefined" && SHOT && SHOT !== "talking");
  // shot=talking forces open
  const forcedOpen = (typeof SHOT !== "undefined" && SHOT === "talking");
  let vis = forcedOpen ? "A" : (talking ? FACE_DRIVE.viseme : "M");
  let next = forcedOpen ? "A" : (talking ? FACE_DRIVE.nextViseme : vis);
  const vState = function (v) {
    const wanted = (typeof VISEME_STATE !== "undefined" && VISEME_STATE[v]) || (v === "M" ? "viseme-m" : v === "A" ? "viseme-a" : "viseme-a");
    if (this.bitmaps[wanted]) return wanted;
    if (v === "M" && this.bitmaps["neutral-closed"]) return "neutral-closed";
    if (this.bitmaps["viseme-a"]) return "viseme-a";
    if (this.bitmaps["furious"]) return "furious";
    return this.bitmaps["neutral-closed"] ? "neutral-closed" : this.states[0];
  }.bind(this);

  const targets = {};
  this.states.forEach(function (s) { targets[s] = 0; });
  if (moodState) targets[moodState] = 1;
  Object.keys(this.moodW).forEach(function (k) {
    springStep(this.moodW[k], targets[k] || 0, dt, 9);
  }.bind(this));
  if (moodState) this.ensureSpring(this.moodW, moodState);
  springStep(this.ensureSpring(this.moodW, moodState), 1, dt, 9);

  const v0 = vState(vis);
  const v1 = vState(next);
  const blend = forcedOpen ? 0 : (FACE_DRIVE.blend || 0);
  const visTarget = {};
  this.states.forEach(function (s) { visTarget[s] = 0; });
  visTarget[v0] = (visTarget[v0] || 0) + (1 - blend);
  visTarget[v1] = (visTarget[v1] || 0) + blend;
  const openAmt = forcedOpen ? 1 : (talking ? Math.max(0, Math.min(1, FACE_DRIVE.open)) : 0);
  // if mouth nearly closed, push weight to closed/M
  if (openAmt < 0.08 && !forcedOpen) {
    const closed = this.bitmaps["viseme-m"] ? "viseme-m" : "neutral-closed";
    Object.keys(visTarget).forEach(function (k) { visTarget[k] = 0; });
    visTarget[closed] = 1;
  }
  Object.keys(visTarget).forEach(function (k) {
    springStep(this.ensureSpring(this.visW, k), visTarget[k] || 0, dt, 20);
  }.bind(this));

  this.nextBlink -= dt;
  if (this.nextBlink <= 0 && !forcedOpen) {
    this.blink.x = 1;
    this.nextBlink = 2.4 + Math.random() * 4;
  }
  springStep(this.blink, 0, dt, 26);

  if (!this.ready && !this.bitmaps["neutral-closed"]) {
    ctx.clearRect(0, 0, sz.w, sz.h);
    return;
  }
  this.draw(ctx, sz, talking || forcedOpen, openAmt, moodName);
};

PhotoEngine.prototype.drawWeighted = function (ctx, w, h, weights, cutoff) {
  let sum = 0;
  const items = [];
  for (const k in weights) {
    const x = weights[k].x;
    if (x > (cutoff || 0.02) && this.bitmaps[k]) {
      items.push([k, x]);
      sum += x;
    }
  }
  if (!sum) {
    const fallback = this.bitmaps["neutral-closed"] || this.bitmaps[this.states[0]];
    if (fallback) ctx.drawImage(fallback, 0, 0, w, h);
    return;
  }
  items.sort(function (a, b) { return b[1] - a[1]; });
  items.forEach(function (it, i) {
    const img = this.bitmaps[it[0]];
    const a = it[1] / sum;
    const off = this.align[it[0]] || [0, 0];
    const dx = (off[0] || 0) * (w / 384);
    const dy = (off[1] || 0) * (h / 384);
    ctx.globalAlpha = i === 0 ? 1 : a;
    ctx.drawImage(img, dx, dy, w, h);
  }.bind(this));
  ctx.globalAlpha = 1;
};

PhotoEngine.prototype.draw = function (ctx, sz, talking, openAmt, moodName) {
  const w = sz.w, h = sz.h;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  const t = this.t;
  const breath = 1 + 0.012 * Math.sin(t * 2.1);
  const sway = (talking ? 1.1 : 0.7) * Math.sin(t * 1.3);
  ctx.translate(w / 2, h / 2);
  ctx.rotate((sway * Math.PI) / 180);
  ctx.scale(breath, breath);
  ctx.translate(-w / 2, -h / 2);

  // mood base
  this.drawWeighted(ctx, w, h, this.moodW, 0.02);

  // mouth layer
  const mw = this.offscreen;
  if (mw.width !== w || mw.height !== h) { mw.width = w; mw.height = h; }
  const mctx = mw.getContext("2d");
  mctx.clearRect(0, 0, w, h);
  this.drawWeighted(mctx, w, h, this.visW, 0.02);
  // feathered ellipse mask
  const mk = this.mask;
  if (mk.width !== w || mk.height !== h) { mk.width = w; mk.height = h; }
  const kctx = mk.getContext("2d");
  kctx.clearRect(0, 0, w, h);
  const box = this.mouth;
  const ex = (box.x / 100) * w, ey = (box.y / 100) * h, ew = (box.w / 100) * w, eh = (box.h / 100) * h;
  const cx = ex + ew / 2, cy = ey + eh / 2, rx = ew / 2, ry = eh / 2;
  const grd = kctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  grd.addColorStop(0, "rgba(0,0,0,1)");
  grd.addColorStop(0.62, "rgba(0,0,0,1)");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  kctx.save();
  kctx.translate(cx, cy);
  kctx.scale(rx, ry);
  kctx.fillStyle = grd;
  // gradient was in unscaled space — build properly:
  kctx.restore();
  kctx.save();
  kctx.fillStyle = "#000";
  kctx.beginPath();
  kctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  kctx.fill();
  // soft edge: blur if available
  try { kctx.filter = "blur(" + Math.max(2, Math.round(Math.min(rx, ry) * 0.18)) + "px)"; 
    kctx.globalCompositeOperation = "source-over";
    kctx.drawImage(mk, 0, 0);
    kctx.filter = "none";
  } catch (e) {}
  kctx.restore();
  mctx.globalCompositeOperation = "destination-in";
  mctx.drawImage(mk, 0, 0);
  mctx.globalCompositeOperation = "source-over";
  ctx.drawImage(mw, 0, 0);

  // eyelids
  const blink = Math.max(0, Math.min(1, this.blink.x));
  if (blink > 0.04) {
    ctx.fillStyle = "rgba(40,24,16," + (0.55 * blink) + ")";
    const eyeY = h * 0.42;
    const eyeR = w * 0.09;
    const lid = eyeR * (0.25 + 0.9 * blink);
    ctx.beginPath();
    ctx.ellipse(w * 0.38, eyeY, eyeR, lid, 0, 0, Math.PI * 2);
    ctx.ellipse(w * 0.62, eyeY, eyeR, lid, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function makeBag(list) {
  let bag = [];
  return function next() {
    if (!bag.length) bag = shuffle(list);
    return bag.pop();
  };
}
const nextLine = {
  start: makeBag(LINES.start),
  idle: makeBag(LINES.idle),
  correct: makeBag(LINES.correct),
  wrong: makeBag(LINES.wrong),
  streak: makeBag(LINES.streak)
};
function nextJoke(lang) { return pick(LINES.jokes[lang] || LINES.idle); }

function pickVoice(lang, gender) {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices() || [];
  if (!voices.length) return null;
  const want = String(lang).toLowerCase().replace("_", "-");
  const prefix = want.slice(0, 2);
  let cands = voices.filter((v) => {
    const L = (v.lang || "").toLowerCase().replace("_", "-");
    return L === want || L === prefix;
  });
  if (!cands.length) cands = voices.filter((v) => (v.lang || "").toLowerCase().replace("_", "-").startsWith(prefix));
  if (!cands.length) return null;
  const fem = /female|woman|girl|zira|samantha|karen|moira|victoria|susan|linda|heami|ting-?ting|yaoyao|kyoko|google.+español|monica|paulina|nari|siri|fiona|tessa|veena|allison|ava|zoe/i;
  const mal = /male|\bman\b|david|daniel|alex|fred|jorge|kangkang|otoya|google.+english.+male|daniel|arthur|ravi|aaron|gordon|tom\b/i;
  if (gender === "she") {
    const f = cands.filter((v) => fem.test(v.name) && !mal.test(v.name));
    if (f.length) return f[0];
    const anyF = voices.filter((v) => fem.test(v.name) && !mal.test(v.name) && /^en/i.test(v.lang || ""));
    if (anyF.length) return anyF[0];
  }
  if (gender === "he") {
    const m = cands.filter((v) => mal.test(v.name) && !fem.test(v.name));
    if (m.length) return m[0];
    const anyM = voices.filter((v) => mal.test(v.name) && !fem.test(v.name) && /^en/i.test(v.lang || ""));
    if (anyM.length) return anyM[0];
  }
  return cands[0];
}

function speak(text, lang, opts) {
  if (!text || !window.speechSynthesis) return;
  unlockAudio();
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || "en-US";
  u.rate = (opts && opts.rate) || 0.92;
  if (opts && opts.pitch) u.pitch = opts.pitch;
  const v = pickVoice(u.lang, opts && opts.gender);
  if (v) u.voice = v;
  if (opts && opts.onBoundary) u.onboundary = opts.onBoundary;
  if (opts && opts.onEnd) {
    u.onend = opts.onEnd;
    u.onerror = opts.onEnd;
  }
  speechSynthesis.speak(u);
  return u;
}

function speakItem(item) {
  const text = item.speak || item.text;
  const lang = LANGS[persist.lang].speech;
  startTalking(text);
  speak(text, lang, { onBoundary: onSpeechBoundary, onEnd: onSpeechEnd });
}

function speakTeacher(text) {
  startTalking(text);
  if (!persist.voiceOn || SHOT) return;
  const t = currentTeacher();
  speak(text, t.voice.lang, {
    gender: t.gender,
    pitch: t.voice.pitch,
    rate: t.voice.rate,
    onBoundary: onSpeechBoundary,
    onEnd: onSpeechEnd
  });
}

function setMood(id, jitter) {
  S.mood = MOODS[id] ? id : pick(MOOD_IDS);
  S.jitter = jitter !== false;

function randomMood() {

function fillName(s) {
  const n = persist.name || "you";
  const p = pronoun(persist.gender);
  return String(s)
    .replaceAll("{name}", n)
    .replaceAll("{He}", p.He)
    .replaceAll("{he}", p.he);
}

function teacherSay(kind, extra) {
  let line;
  if (kind === "joke") line = nextJoke(persist.lang);
  else if (kind === "idle") line = nextLine.idle();
  else if (kind === "start") line = nextLine.start();
  else if (kind === "streak") line = nextLine.streak();
  else if (kind === "correct") line = nextLine.correct();
  else if (kind === "wrong") line = nextLine.wrong();
  else line = extra || nextLine.idle();
  if (extra && (kind === "custom")) line = extra;
  S.line = fillName(line);
  if (kind === "correct" && persist.streak && persist.streak % 3 === 0 && persist.streak > 0) {
    S.line = fillName(nextLine.streak());
  }
  speakTeacher(S.line);
}

function reactCorrect() {
  persist.score += 1;
  persist.streak += 1;
  if (persist.streak > persist.best) persist.best = persist.streak;
  save();
  const mood = pick(["pride", "manic", "calm", "scheming", "unhinged"]);
  setMood(mood, mood === "manic" || mood === "unhinged" || Math.random() < 0.4);
  if (persist.streak >= 3 && persist.streak % 3 === 0) teacherSay("streak");
  else if (Math.random() < 0.3) {
    teacherSay("custom", nextLine.correct() + " " + nextJoke(persist.lang));
  } else teacherSay("correct");
}

function reactWrong() {
  persist.streak = 0;
  save();
  const mood = pick(["furious", "annoyed", "dramatic", "exhausted", "unhinged"]);
  setMood(mood, true);
  if (Math.random() < 0.35) {
    teacherSay("custom", nextLine.wrong() + " " + nextJoke(persist.lang));
  } else teacherSay("wrong");
}

function maybeNonesense() {
  /* Unhinged reactions only fire on a wrong answer. */
}

function dataFor() { return CURRICULUM[persist.lang]; }

function quizChoices(item, pool) {
  const others = shuffle(pool.filter((x) => x.meaning !== item.meaning)).slice(0, 3);
  return shuffle([item].concat(others));
}

function teachText(item) {
  const reading = item.reading ? " (" + item.reading + ")" : "";
  let meaning = item.meaning || "";
  if (meaning && !/[.!?…。！？]$/.test(meaning)) meaning += ".";
  return item.text + reading + "  —  " + meaning;
}

function startDeck(cat, mode) {
  S.cat = cat;
  S.mode = mode;
  S.picked = -1;
  S.revealed = false;
  S.flipped = false;
  S.correct = null;
  S.teach = "";
  S.recStatus = "";
  S.recText = "";
  const d = dataFor();
  if (cat === "talk") {
    S.talk = SHOT ? d.talks[1] || d.talks[0] : pick(d.talks);
    S.lineI = SHOT ? 0 : 0;
    S.screen = "talk";
    S.revealed = !!SHOT;
    if (!SHOT) {
      if (typeof sayStart === "function") sayStart();
      else setMood("calm", false);
    }
    return render();
  }
  const pool = cat === "phrases" ? d.phrases : d.words;
  S.deck = shuffle(pool.slice());
  S.i = 0;
  S.screen = cat === "phrases" ? "phrases" : "vocab";
  prepItem();
  if (!SHOT) {
    if (typeof sayStart === "function") sayStart();
    else setMood("calm", false);
  }
  render();
}

function currentItem() {
  if (S.screen === "talk") return S.talk.lines[S.lineI];
  return S.deck[S.i];
}

function prepItem() {
  const item = currentItem();
  const pool = S.cat === "phrases" ? dataFor().phrases : (S.cat === "talk" ? S.talk.lines : dataFor().words);
  S.choices = quizChoices(item, pool);
  S.picked = -1;
  S.revealed = false;
  S.flipped = false;
  S.correct = null;
  S.teach = "";
  S.recStatus = "";
  S.recText = "";
}

function goNext() {
  if (typeof cancelAdvance === "function") cancelAdvance();
  if (S.screen === "talk") {
    if (S.lineI < S.talk.lines.length - 1) S.lineI += 1;
    else {
      S.talk = pick(dataFor().talks);
      S.lineI = 0;
    }
    prepItem();
    render();
    return;
  }
  if (S.i < S.deck.length - 1) S.i += 1;
  else {
    S.deck = shuffle(S.deck);
    S.i = 0;
  }
  prepItem();
  render();
}

function answerChoice(idx) {
  if (S.picked >= 0) return;
  const item = currentItem();
  S.picked = idx;
  S.revealed = true;
  S.teach = teachText(item);
  const ok = S.choices[idx].meaning === item.meaning;
  S.correct = ok;
  if (ok) reactCorrect();
  else reactWrong();
  render();
}

function flipCard() {
  S.flipped = !S.flipped;
  if (S.flipped) S.teach = teachText(currentItem());
  render();
}

function rateSelf(good) {
  if (S.revealed && S.correct !== null) {
    goNext();
    return;
  }
  S.revealed = true;
  S.teach = teachText(currentItem());
  S.correct = !!good;
  if (good) reactCorrect();
  else reactWrong();
  render();
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function canRecognize() { return !!SR; }

function listenRepeat() {
  if (!SR) {
    S.recStatus = "This browser cannot check your speech. Self-rate instead.";
    render();
    return;
  }
  unlockAudio();
  const rec = new SR();
  rec.lang = LANGS[persist.lang].speech;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  S.listening = true;
  S.recStatus = "Listening… say the word or phrase.";
  S.recText = "";
  render();
  rec.onresult = (ev) => {
    const said = (ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || "";
    S.recText = said;
    S.listening = false;
    const item = currentItem();
    const ok = looseMatch(said, item);
    S.revealed = true;
    S.teach = teachText(item);
    S.correct = ok;
    S.recStatus = ok ? "Bao heard a match. Still, check the model line." : "Bao is unsure. Compare with the model line — no harm done.";
    if (ok) reactCorrect();
    else reactWrong();
    render();
  };
  rec.onerror = () => {
    S.listening = false;
    S.recStatus = "Could not hear you. You can still self-rate.";
    render();
  };
  rec.onend = () => {
    if (S.listening) {
      S.listening = false;
      if (!S.recText) S.recStatus = "No speech caught. Try again, or self-rate.";
      render();
    }
  };
  try { rec.start(); } catch (e) {
    S.listening = false;
    S.recStatus = "Microphone is not available. Self-rate instead.";
    render();
  }
}

function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^\p{L}\p{N}]+/gu, "");
}
function looseMatch(said, item) {
  const a = norm(said);
  if (!a) return false;
  const targets = [item.text, item.speak, item.reading].map(norm).filter(Boolean);
  return targets.some((t) => t && (a === t || a.includes(t) || t.includes(a)));
}

        : '<button class="btn secondary" data-act="reveal">Reveal meaning</button>') +

  } else if (S.mode === "quiz") {
    body = '<p class="setting">' + escapeHtml(talk.title) + " · listen and pick the meaning</p>" +
      itemCard(item, { hideText: true, prompt: "Listen to this line" }) +
      renderChoices() + teachBox() + nextBtn();
  } else {
    body = '<p class="setting">' + escapeHtml(talk.title) + " · repeat this line</p>" +
      itemCard(item, { prompt: "Listen, then say it", showMeaning: S.revealed }) +
      teachBox() +
      (canRecognize()
        ? '<button class="btn secondary" data-act="listen-me"' + (S.listening ? " disabled" : "") + ">" + (S.listening ? "Listening…" : "Check my speech") + "</button>"
        : "") +
      '<p class="rec">' + escapeHtml(S.recStatus) + "</p>" +
      selfRate();
  }
  return (
    '<div class="screen" data-screen="talk">' +
      header("Small Talk · " + L.native, "home") +
      progressBar(S.lineI, talk.lines.length) +
      teacherBar() +
      modeRow("talk") +
      body +
    "</div>"
  );
}

function render() {
  const app = document.getElementById("app");
  let html = "";
  if (S.screen === "login") html = renderLogin();
  else if (S.screen === "teacher") html = renderTeacher();
  else if (S.screen === "language") html = renderLanguage();
  else if (S.screen === "home") html = renderHome();
  else if (S.screen === "talk") html = renderTalk();
  else html = renderDrill(S.screen === "phrases" ? "phrases" : "vocab");
  app.innerHTML = html;
  bind(app);
  applyMouthToDOM();
  if (typeof bindFaceEngines === "function") bindFaceEngines();
  if (S.screen === "teacher") {
    const on = document.querySelector(".char-card.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function bind(root) {
  const nameInput = qs("#name", root);
  if (nameInput) {
    nameInput.addEventListener("input", () => {
      S.nameDraft = nameInput.value;
      const btn = qs("[data-act=login]", root);
      if (btn) btn.disabled = !S.nameDraft.trim();
    });
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  }
  qsa("[data-act]", root).forEach((node) => {
    node.addEventListener("click", (e) => {
      const act = node.getAttribute("data-act");
      if (!act) return;
      handle(act, node, e);
    });
  });
}

function doLogin() {
  const n = (S.nameDraft || "").trim();
  if (!n) return;
  persist.name = n;
  save();
  touchDay();
  S.screen = "teacher";
  if (typeof sayStart === "function") sayStart();
  else setMood("calm", false);
  render();
}

function handle(act, node, e) {
  unlockAudio();
  if (act === "login") return doLogin();
  if (act === "gender") {
    persist.gender = node.getAttribute("data-g");
    if (!persist.lastChar) persist.lastChar = { he: "real-m-01", she: "real-f-01" };
    persist.characterId = persist.lastChar[persist.gender] || (persist.gender === "she" ? "real-f-01" : "real-m-01");
    save();
    setMood("calm", false);
    S.anim = "";
    S.line = persist.gender === "she"
      ? "She is in. Cô Bao. I'll stay calm until a miss. Then we will talk."
      : "He is in. Thầy Bao. I'll stay calm until a miss. Then we will talk.";
    if (typeof speakTeacher === "function") speakTeacher(S.line);
    return render();
  }
  if (act === "voice") {
    persist.voiceOn = !persist.voiceOn;
    save();
    if (persist.voiceOn) speakTeacher("Voice is on. I will say the words, and I will comment if you miss.");
    return render();
  }
  if (act === "pick-char") {
    if (typeof selectCharacter === "function") selectCharacter(node.getAttribute("data-id"));
    else persist.characterId = node.getAttribute("data-id");
    setMood("calm", false);
    S.anim = "";
    const tch = currentTeacher();
    S.line = tch.name + " is in. I'll stay calm until a miss.";
    if (typeof speakTeacher === "function") speakTeacher(S.line);
    return render();
  }
  if (act === "goto") {
    const to = node.getAttribute("data-to");
    if (to === "language") { persist.seenTeacher = true; save(); }
    S.screen = to;
    if (to === "teacher" && !S.line) { if (typeof sayStart === "function") sayStart(); else setMood("calm", false); }
    return render();
  }
  if (act === "back") {
    const to = node.getAttribute("data-to");
    S.screen = to;
    return render();
  }
  if (act === "pick-lang") {
    persist.lang = node.getAttribute("data-lang");
    save();
    S.screen = "home";
    if (typeof sayStart === "function") sayStart();
    else setMood("calm", false);
    return render();
  }
  if (act === "open-cat") {
    const cat = node.getAttribute("data-cat");
    const mode = cat === "talk" ? "dialogue" : "quiz";
    startDeck(cat, mode);
    return;
  }
  if (act === "mode") {
    const mode = node.getAttribute("data-mode");
    if (S.cat === "talk") {
      S.mode = mode;
      prepItem();
      return render();
    }
    startDeck(S.cat, mode);
    return;
  }
  if (act === "play") {
    speakItem(currentItem());
    return;
  }
  if (act === "choice") {
    answerChoice(Number(node.getAttribute("data-i")));
    return;
  }
  if (act === "next") { goNext(); return; }
  if (act === "flip") { flipCard(); return; }
  if (act === "reveal") {
    S.revealed = true;
    S.teach = teachText(currentItem());
    return render();
  }
  if (act === "rate") {
    rateSelf(node.getAttribute("data-ok") === "1");
    return;
  }
  if (act === "listen-me") { listenRepeat(); return; }
}

/* ===== 07-teacher-audio.js ===== */

/* Neural clips + escalation reactions (overrides earlier speak/react helpers). */
const BAG_KEY = "bao-line-bags-v1";

function loadBags() {
  try { return JSON.parse(localStorage.getItem(BAG_KEY) || "{}"); } catch (e) { return {}; }
}
function saveBags(bags) {
  try { localStorage.setItem(BAG_KEY, JSON.stringify(bags)); } catch (e) {}
}
function nextBagItem(bagKey, items) {
  if (!items || !items.length) return null;
  const bags = loadBags();
  const ids = items.map((it) => it.id);
  let bag = Array.isArray(bags[bagKey]) ? bags[bagKey].filter((id) => ids.indexOf(id) >= 0) : [];
  if (!bag.length) {
    bag = ids.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = bag[i];
      bag[i] = bag[j];
      bag[j] = tmp;
    }
  }
  const id = bag.pop();
  bags[bagKey] = bag;
  saveBags(bags);
  return items.find((it) => it.id === id) || items[0];
}

function fillTemplate(text, ctx) {
  let out = String(text || "");
  const map = {
    "{word}": ctx.word || "",
    "{meaning}": ctx.meaning || "",
    "{reading}": ctx.reading || "",
    "{langName}": ctx.langName || "",
    "{joke}": ctx.joke || ""
  };
  Object.keys(map).forEach((k) => { out = out.split(k).join(map[k]); });
  out = out.replace(/\s+/g, " ").replace(/^[\s,.—–-]+|[\s,.—–-]+$/g, "").trim();
  // If a joke slot was empty, drop leftover glue like "Meanwhile,"
  if (!ctx.joke) out = out.replace(/^(Meanwhile|Anyway|And then),?\s+/i, "");
  return out;
}

function itemContext() {
  let item = null;
  try { item = currentItem(); } catch (e) { item = null; }
  const lang = persist.lang;
  const L = LANGS[lang] || {};
  return {
    word: item ? item.text : "",
    meaning: item ? (item.meaning || "") : "",
    reading: item && item.reading ? item.reading : "",
    lang: lang,
    langName: L.name || lang,
    speak: item ? (item.speak || item.text) : "",
    item: item
  };
}

function lessonAudioUrl(item) {
  if (!item || typeof AUDIO_INDEX === "undefined") return "";
  const tch = currentTeacher();
  const gender = tch.lessonGender || tch.gender;
  const lang = persist.lang;
  const speak = item.speak || item.text;
  const pack = AUDIO_INDEX.lesson && AUDIO_INDEX.lesson[gender] && AUDIO_INDEX.lesson[gender][lang];
  return (pack && pack[speak]) || "";
}

function teacherClip(charId, lineId) {
  if (!lineId || typeof AUDIO_INDEX === "undefined") return null;
  const aliases = { "real-m-01": "thay_bao", "real-f-01": "co_bao", thay_bao: "thay_bao", co_bao: "co_bao" };
  const packRoot = AUDIO_INDEX.teacher || {};
  const ids = [charId];
  if (aliases[charId]) ids.push(aliases[charId]);
  const tch = (typeof currentTeacher === "function") ? currentTeacher() : null;
  if (tch && tch.audioId && ids.indexOf(tch.audioId) < 0) ids.push(tch.audioId);
  for (let i = 0; i < ids.length; i++) {
    const pack = packRoot[ids[i]];
    if (pack && pack[lineId]) return pack[lineId];
  }
  return null;
}

function composeWrong(level, ctx) {
  const pools = TEACHER_LINES.pools.wrong;
  const fixed = nextBagItem("wrong-" + level, pools[String(level)] || pools["1"]);
  const tpls = (TEACHER_LINES.templates.wrong || []).filter((t) => {
    const lv = t.levels || [];
    return !lv.length || lv.indexOf(level) >= 0 || lv.indexOf(Number(level)) >= 0 || lv.indexOf(String(level)) >= 0;
  });
  const tpl = tpls.length ? nextBagItem("tpl-wrong-" + level, tpls) : null;
  let joke = null;
  if (tpl && /\{joke\}/.test(tpl.text)) {
    joke = nextBagItem("joke-" + ctx.lang, TEACHER_LINES.jokes[ctx.lang] || []);
  }
  const filled = tpl ? fillTemplate(tpl.text, Object.assign({}, ctx, { joke: joke ? joke.text : "" })) : "";
  const text = [fixed && fixed.text, filled].filter(Boolean).join(" ");
  return { text: text, fixed: fixed, tpl: tpl, joke: joke, level: Number(level) };
}

function composeCorrect(ctx, afterLong) {
  const reset = afterLong ? nextBagItem("reset", TEACHER_LINES.pools.reset) : null;
  const fixed = nextBagItem("correct", TEACHER_LINES.pools.correct);
  let tpl = null;
  let filled = "";
  if (ctx.word && Math.random() < 0.45) {
    tpl = nextBagItem("tpl-correct", TEACHER_LINES.templates.correct || []);
    filled = tpl ? fillTemplate(tpl.text, ctx) : "";
  }
  const text = [reset && reset.text, fixed && fixed.text, filled].filter(Boolean).join(" ");
  return { text: text, reset: reset, fixed: fixed, tpl: tpl };
}

function applyWrongMood(level) {
  const moods = (TEACHER_LINES.moods && TEACHER_LINES.moods.wrong) || { "1": "annoyed", "2": "dramatic", "3": "furious", "4": "manic" };
  const mood = moods[String(level)] || "furious";
  const jitterOn = !!(TEACHER_LINES.jitter && TEACHER_LINES.jitter[String(level)]);
  setMood(mood, jitterOn);
  S.anim = (TEACHER_LINES.animation && TEACHER_LINES.animation[String(level)]) || "";
}

let clipAudio = null;
let audioCtx = null;
let analyserNode = null;
let mediaSrc = null;
let hookedEl = null;
let rafMouth = 0;
let advanceTimer = 0;
let wordTimings = null;
let sharedAudio = null;

function cancelAdvance() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = 0; }
}

function scheduleAdvance(ms) {
  cancelAdvance();
  advanceTimer = setTimeout(function () {
    advanceTimer = 0;
    goNext();
  }, ms);
}

function stopClips() {
  cancelAdvance();
  if (rafMouth) { cancelAnimationFrame(rafMouth); rafMouth = 0; }
  if (clipAudio) {
    try { clipAudio.onended = null; clipAudio.onerror = null; clipAudio.pause(); } catch (e) {}
    clipAudio = null;
  }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}

function ensureAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") {
    try { audioCtx.resume(); } catch (e) {}
  }
  return audioCtx;
}

function hookAnalyser(el, text) {
  const ctx = ensureAudioCtx();
  if (ctx) {
    try {
      if (hookedEl !== el) {
        mediaSrc = ctx.createMediaElementSource(el);
        analyserNode = ctx.createAnalyser();
        analyserNode.fftSize = 256;
        mediaSrc.connect(analyserNode);
        analyserNode.connect(ctx.destination);
        hookedEl = el;
      }
    } catch (e) {}
  }
  const data = analyserNode ? new Uint8Array(analyserNode.fftSize) : null;
  TALK.on = true;
  function tick() {
    if (!clipAudio || clipAudio !== el) return;
    let amp = 0.35;
    if (analyserNode && data) {
      try {
        analyserNode.getByteTimeDomainData(data);
        let s = 0;
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;
          s += v * v;
        }
        amp = Math.sqrt(s / data.length);
      } catch (e) {}
    }
    const t = el.currentTime || 0;
    const dur = el.duration || 0;
    let vis = "A";
    if (wordTimings && wordTimings.length) {
      let w = null;
      for (let i = 0; i < wordTimings.length; i++) {
        const cand = wordTimings[i];
        const end = cand.start + (cand.duration || 0.12) + 0.06;
        if (t >= cand.start && t < end) { w = cand; break; }
      }
      if (w) vis = visemeForText(w.text);
    } else if (text && dur) {
      vis = visemeForText(text);
    }
    const openAmp = Math.min(1, Math.max(0, (amp - 0.02) * 7));
    if (openAmp < 0.06 && !(analyserNode && data && amp === 0.35)) {
      // If we have no analyser, keep a modest open during playback.
      if (!analyserNode) {
        TALK.viseme = vis;
        TALK.open = VISEME_OPEN[vis] || 0.7;
        TALK.scale = (typeof VISEME_SCALE !== "undefined" && VISEME_SCALE[vis]) || 1;
      } else {
        TALK.viseme = "M";
        TALK.open = 0;
        TALK.scale = 1;
      }
    } else {
      TALK.viseme = vis;
      TALK.open = Math.max(openAmp, ((typeof VISEME_OPEN !== "undefined" && VISEME_OPEN[vis]) || 0.6) * 0.55);
      TALK.scale = (typeof VISEME_SCALE !== "undefined" && VISEME_SCALE[vis]) || 1;
    }
    applyMouthToDOM();
    rafMouth = requestAnimationFrame(tick);
  }
  if (rafMouth) cancelAnimationFrame(rafMouth);
  rafMouth = requestAnimationFrame(tick);
}

function loadMeta(url) {
  if (!url) return Promise.resolve(null);
  return fetch(url).then((r) => (r.ok ? r.json() : null)).catch(function () { return null; });
}

function getSharedAudio() {
  if (!sharedAudio) sharedAudio = new Audio();
  return sharedAudio;
}

function playUrl(url, text) {
  return new Promise(function (resolve, reject) {
    const a = getSharedAudio();
    a.onended = null;
    a.onerror = null;
    a.src = url;
    a.preload = "auto";
    clipAudio = a;
    hookAnalyser(a, text);
    a.onended = function () { resolve("ok"); };
    a.onerror = function () { reject(new Error("audio error")); };
    const p = a.play();
    if (p && p.catch) p.catch(reject);
  });
}

function playQueue(parts, fallbackText, onEnd) {
  stopClips();
  if (!persist.voiceOn || SHOT) {
    if (fallbackText) startTalking(fallbackText);
    if (onEnd) setTimeout(onEnd, Math.min(4200, 700 + String(fallbackText || "").length * 38));
    return;
  }
  (async function () {
    let played = false;
    for (let i = 0; i < (parts || []).length; i++) {
      const part = parts[i];
      if (!part || !part.url) continue;
      try {
        const meta = part.meta ? await loadMeta(part.meta) : null;
        wordTimings = meta && meta.words ? meta.words : null;
        await playUrl(part.url, part.text || fallbackText);
        played = true;
      } catch (e) {
        continue;
      }
    }
    if (!played) {
      startTalking(fallbackText || "");
      const t = currentTeacher();
      speak(fallbackText || "", t.voice.lang, {
        gender: t.gender,
        pitch: t.voice.pitch,
        rate: t.voice.rate,
        onBoundary: onSpeechBoundary,
        onEnd: function () {
          stopTalking(true);
          if (onEnd) onEnd();
        }
      });
      return;
    }
    stopTalking(true);
    if (onEnd) onEnd();
  })();
}

function playReaction(composed, ctx, onEnd) {
  const cid = currentTeacher().id;
  const parts = [];
  function addClip(line) {
    if (!line) return;
    const rec = teacherClip(cid, line.id);
    if (rec) parts.push({ url: rec.mp3 || rec, meta: rec.meta, text: line.text });
  }
  addClip(composed.reset);
  addClip(composed.fixed);
  addClip(composed.joke);
  if (ctx && ctx.item) {
    const u = lessonAudioUrl(ctx.item);
    if (u) parts.push({ url: u, meta: u.replace(/\.mp3$/, ".json"), text: ctx.speak });
  }
  playQueue(parts, composed.text, onEnd);
}

function speakItem(item) {
  if (!item) return;
  const text = item.speak || item.text;
  const url = lessonAudioUrl(item);
  const meta = url ? url.replace(/\.mp3$/, ".json") : "";
  playQueue(url ? [{ url: url, meta: meta, text: text }] : [], text);
}

function speakTeacher(text) {
  if (!text) return;
  playQueue([], text);
}

function sayStart() {
  setMood("calm", false);
  S.anim = "";
  const line = nextBagItem("start", TEACHER_LINES.pools.start);
  S.line = line ? line.text : "All right. Let's begin.";
  const rec = line ? teacherClip(currentTeacher().id, line.id) : null;
  playQueue(rec ? [{ url: rec.mp3 || rec, meta: rec.meta, text: S.line }] : [], S.line);
}

function reactCorrect() {
  const longMiss = (S.missStreak || 0) >= 3;
  persist.score += 1;
  persist.streak += 1;
  if (persist.streak > persist.best) persist.best = persist.streak;
  S.missStreak = 0;
  save();
  setMood("calm", false);
  S.anim = "";
  const ctx = itemContext();
  const composed = composeCorrect(ctx, longMiss);
  S.line = composed.text;
  playReaction(composed, ctx, function () {
    if (!SHOT) scheduleAdvance(700);
  });
}

function reactWrong() {
  persist.streak = 0;
  S.missStreak = (S.missStreak || 0) + 1;
  save();
  const level = Math.min(4, S.missStreak);
  applyWrongMood(level);
  const ctx = itemContext();
  const composed = composeWrong(level, ctx);
  S.line = composed.text;
  if (ctx.item) S.teach = teachText(ctx.item);
  playReaction(composed, ctx);
}

function maybeNonesense() {
  /* Unhinged lines play only after a miss. */
}
